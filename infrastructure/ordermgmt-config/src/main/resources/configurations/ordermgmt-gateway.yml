server:
  port: 8080

spring:
  application:
    name: ordermgmt-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: ordermgmt-users
          uri: http://ordermgmt-users:8092
          predicates:
            - Path=/auth/**
          filters:
            - AuthResponse
        - id: ordermgmt-product
          uri: http://ordermgmt-product:8090
          predicates:
             - Path=/api/product/**
        - id: ordermgmt-order
          uri: http://ordermgmt-order:9090
          predicates:
            - Path=/api/order/**

      # 👇 CORS debe ir ACÁ dentro de spring.cloud.gateway
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginsPatterns:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
eureka:
  client:
    # Para usar lb:// necesitás que el gateway consulte Eureka
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, beans, metrics, info, env
  endpoint:
    health:
      show-details: always



logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route.RouteLocator: INFO
    reactor.netty.http.client: DEBUG